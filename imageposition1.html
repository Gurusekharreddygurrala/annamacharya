<!DOCTYPE html>
<html>
<head>
  <title>No Space Between Images</title>
  <style>
    .left-stack {
      position: absolute;
      top: 0;
      left: 0;
    }

    .left-stack img {
      display: block;
      width: 100px;
      margin: 0;
      padding: 0;
      border: none;
    }
  </style>
</head>
<body>

  <div class="left-stack">
    <img src="C:\Users\gurus\Pictures\aits1.jpeg" alt="Image 1">
    <img src="C:\Users\gurus\Pictures\aits1.jpeg" alt="Image 2">
    <img src="C:\Users\gurus\Pictures\aits1.jpeg" alt="Image 3">
  </div>

</body>
</html>
