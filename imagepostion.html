<!DOCTYPE html>
<html>
<head>
  <title>Three Positioned Images</title>
  <style>
    .img-top {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 100px;
    }

    .img-middle {
      position: absolute;
      top: 45%;  /* Adjust as needed */
      left: 10px;
      width: 100px;
      transform: translateY(-50%);
    }

    .img-bottom {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 100px;
    }
  </style>
</head>
<body>

  <!-- Top-left -->
  <img src="C:\Users\gurus\Pictures\aits1.jpeg"class="img-top" alt="Top Image">

  <!-- Middle-left -->
  <img src="C:\Users\gurus\Pictures\aits1.jpeg" class="img-middle" alt="Middle Image">

  <!-- Bottom-left -->
  <img src="C:\Users\gurus\Pictures\aits1.jpeg" class="img-bottom" alt="Bottom Image">

</body>
</html>
