<!DOCTYPE html>
<html>
<head>
  <title>Div and Span Example</title>
</head>
<body>

  <div style="background-color: pink; padding: 10px;">
    <h2>This is inside a div</h2>
    <p>Div is used to group block elements together.</p>
  </div>

  <p>This is a <span style="color: red;">red word</span> using span inside a paragraph.</p>

</body>
</html>
