<!DOCTYPE html>
<html>
<head>
  <style>
    .box-px {
      width: 300px;
      background-color: lightblue;
    }

    .box-percent {
      width: 90%;
      background-color: lightgreen;
    }
  </style>
</head>
<body>
  <div class="box-px">Fixed width (300px)</div>
  <div class="box-percent">Half the width of the page (50%)</div>
</body>
</html>
##<!DOCTYPE html>

<head>

    span {
      display: inline;
      background-color: lightgray;
    }

    div {
      display: block;
      background-color: orange;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <span>This is inline</span>
  <span>Another inline</span>
  <div>This is block</div>
</body>
</html>
