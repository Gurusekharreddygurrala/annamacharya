<!DOCTYPE html>
<html>
<head>
  <style>
    ul {
      list-style-type: square;
      color: darkblue;
    }

    ol {
      list-style-type: upper-roman;
      color: green;
    }
  </style>
</head>
<body>
  <ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
  </ul>

  <ol>
    <li>Step One</li>
    <li>Step Two</li>
    <li>Step Three</li>
  </ol>
</body>
</html>
