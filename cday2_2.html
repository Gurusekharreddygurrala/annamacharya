<!DOCTYPE html>
<html>
<head>
  <title>CSS ID Selector</title>
  <style>
    #unique {
      color: blue;
      font-weight: bold;
      border: 1px dashed gray;
      padding: 10px;
    }
  </style>
</head>
<body>

  <p id="unique">This paragraph has a unique style using ID.</p>
  <p>This paragraph is normal and not affected.</p>

</body>
</html>
