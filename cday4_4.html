<!DOCTYPE html>
<html>
<head>
  <style>
    .background {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 200px;
      height: 200px;
      background-color: lightgray;
      z-index: 1;
    }

    .foreground {
      position: absolute;
      top: 100px;
      left: 100px;
      width: 200px;
      height: 200px;
      background-color: green;
      color: white;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="foreground">This is on top</div>
</body>
</html>
