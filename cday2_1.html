<!DOCTYPE html>
<html>
<head>
  <title>CSS Class Selector</title>
  <style>
    .highlight {
      color: white;
      background-color: green;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <p class="highlight">This paragraph uses a class called "highlight".</p>
  <p>This paragraph is normal and has no styling.</p>

</body>
</html>
