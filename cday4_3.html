<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      position: relative;
      width: 400px;
      height: 200px;
      background-color: lightblue;
      border: 2px solid navy;
      margin: 50px auto;
    }

    .box {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: red;
      padding: 10px;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">I'm absolutely positioned</div>
  </div>
</body>
</html>
