<!DOCTYPE html>
<html>
<head>
  <style>
    button {
      background-color: orange;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: darkorange;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <button>Hover Me</button>
</body>
</html>
